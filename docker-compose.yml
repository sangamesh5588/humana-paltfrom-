version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: human_platform_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: human_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: ./services/api/Dockerfile
    container_name: human_platform_api
    restart: always
    depends_on:
      - postgres
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:supersecretpassword@postgres:5432/human_platform?schema=public
      - JWT_SECRET=change-this-in-production-use-a-very-long-safe-secret
      - SUPABASE_URL=https://your-supabase-url.supabase.co
      - SUPABASE_ANON_KEY=anon-key
      - SUPABASE_SERVICE_ROLE_KEY=service-role-key
    ports:
      - "3000:3000"

volumes:
  postgres_data:
